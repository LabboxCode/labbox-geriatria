<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar asistencia · Labbox</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #1a0a35;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #280C4C;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5);
  }
  .header {
    background: linear-gradient(135deg, #280C4C, #3d1470);
    padding: 24px 28px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .labbox-wordmark { font-size: 26px; font-weight: 900; letter-spacing: -1px; }
  .labbox-wordmark span:first-child { color: #fff; }
  .labbox-wordmark span:last-child  { color: #FC7A1D; }
  .academia-logo-wrap {
    width: 48px; height: 48px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.15);
    background: #fff;
  }
  .academia-logo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .event-pill {
    margin: 20px 28px 0;
    background: linear-gradient(135deg, #3d1470, #280C4C);
    border: 1px solid rgba(117,53,202,0.35);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
  }
  .ev-block { text-align: center; flex: 1; }
  .ev-block + .ev-block { border-left: 1px solid rgba(255,255,255,0.08); }
  .ev-val { display: block; color: #fff; font-size: 13px; font-weight: 700; }
  .ev-lbl { display: block; color: rgba(255,255,255,0.35); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .form-area { padding: 24px 28px 28px; }
  .form-title { color: #fff; font-size: 18px; font-weight: 900; margin-bottom: 4px; }
  .form-sub { color: rgba(255,255,255,0.4); font-size: 11px; margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 13px 16px;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.25); }
  .field input:focus { border-color: #FC7A1D; background: rgba(252,122,29,0.05); }
  .toggle-label {
    display: block;
    color: rgba(255,255,255,0.5);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .toggle-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .toggle-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.4);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .toggle-btn.active-yes { background: rgba(252,122,29,0.15); border-color: #FC7A1D; color: #FC7A1D; }
  .toggle-btn.active-no  { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); }
  .submit-btn {
    width: 100%;
    background: linear-gradient(135deg, #FC7A1D, #d95e00);
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 15px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(252,122,29,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(252,122,29,0.45); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .loading { opacity: 0.7; pointer-events: none; }
  .success-screen {
    display: none;
    padding: 48px 28px;
    text-align: center;
  }
  .success-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #FC7A1D, #d95e00);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 20px;
    box-shadow: 0 8px 24px rgba(252,122,29,0.4);
  }
  .success-title { color: #fff; font-size: 20px; font-weight: 900; margin-bottom: 8px; }
  .success-sub { color: rgba(255,255,255,0.45); font-size: 12px; line-height: 1.7; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeUp 0.5s ease both; }
</style>
</head>

  <div class="event-pill">
    <div class="ev-block">
      <span class="ev-val">10 de Abril</span>
      <span class="ev-lbl">Fecha</span>
    </div>
    <div class="ev-block">
      <span class="ev-val">8:00 PM</span>
      <span class="ev-lbl">Hora</span>
    </div>
    <div class="ev-block">
      <span class="ev-val">Aromali</span>
      <span class="ev-lbl">Lugar</span>
    </div>
  </div>

  <div class="form-area" id="formArea">
    <div class="form-title">Confirma tu lugar</div>
    <div class="form-sub">Solo toma 10 segundos · Cupo limitado</div>

    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="nombre" placeholder="Dr. Juan Pérez">
    </div>
    <div class="field">
      <label>Teléfono / WhatsApp</label>
      <input type="tel" id="telefono" placeholder="+52 81 1234 5678">
    </div>

    <div class="toggle-label">¿Confirmas asistencia?</div>
    <div class="toggle-row">
      <button class="toggle-btn" id="btnSi" onclick="selectAsistencia('si')">✓ Sí, asistiré</button>
      <button class="toggle-btn" id="btnNo" onclick="selectAsistencia('no')">✕ No puedo</button>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="enviar()" disabled>
      Enviar confirmación
    </button>
  </div>

  <div class="success-screen" id="successScreen">
    <div class="success-icon" id="successIcon">✓</div>
    <div class="success-title" id="successTitle">¡Nos vemos el 10!</div>
    <div class="success-sub" id="successSub">Tu lugar está reservado.<br>Te esperamos en Aromali a las 8:00 PM.</div>
  </div>

</div>
<script>
  // ✏️ REEMPLAZA ESTA URL con la que genera tu Google Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYgu29X5XsU3sJOEE4W0LdE2-ok-Frchy8x-IG_GTB8-JGPdXPjzrovQd3wbYPJ3UC/exec";

  let asistencia = null;

  function selectAsistencia(val) {
    asistencia = val;
    document.getElementById('btnSi').className = 'toggle-btn' + (val === 'si' ? ' active-yes' : '');
    document.getElementById('btnNo').className = 'toggle-btn' + (val === 'no' ? ' active-no' : '');
    checkForm();
  }

  function checkForm() {
    const nombre = document.getElementById('nombre').value.trim();
    const tel    = document.getElementById('telefono').value.trim();
    document.getElementById('submitBtn').disabled = !(nombre && tel && asistencia);
  }

  document.getElementById('nombre').addEventListener('input', checkForm);
  document.getElementById('telefono').addEventListener('input', checkForm);

  async function enviar() {
    const nombre    = document.getElementById('nombre').value.trim();
    const telefono  = document.getElementById('telefono').value.trim();
    const btn       = document.getElementById('submitBtn');

    btn.textContent = 'Enviando...';
    btn.disabled    = true;

    const params = new URLSearchParams({ nombre, telefono, asistencia });

    try {
      await fetch(SCRIPT_URL + '?' + params.toString(), { method: 'GET', mode: 'no-cors' });
    } catch(e) {
      // no-cors: respuesta opaca, igual consideramos exitoso
    }

    document.getElementById('formArea').style.display = 'none';
    const s = document.getElementById('successScreen');
    s.style.display = 'block';

    if (asistencia === 'si') {
      document.getElementById('successTitle').textContent = '¡Nos vemos el 10, ' + nombre.split(' ')[0] + '!';
      document.getElementById('successSub').innerHTML = 'Tu lugar está reservado.<br>Te esperamos en Aromali a las 8:00 PM.';
    } else {
      document.getElementById('successIcon').textContent = '👋';
      document.getElementById('successTitle').textContent = 'Gracias, ' + nombre.split(' ')[0];
      document.getElementById('successSub').innerHTML = 'Lamentamos que no puedas asistir.<br>Estaremos en contacto pronto.';
    }
  }
</script>
